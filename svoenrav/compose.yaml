# Adapted from frappe/frappe_docker pwd.yml; MIT licence in licenses/.
# Local persistent installation; source code is built from this checkout.
services:
  backend:
    image: svoenrav/erp:16.53.0-local
    networks:
    - frappe_network
    volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: db
      DB_PORT: '3306'
    depends_on:
      configurator:
        condition: service_completed_successfully
    pull_policy: never
    restart: unless-stopped
    build:
      context: ..
      dockerfile: svoenrav/Dockerfile
  configurator:
    image: svoenrav/erp:16.53.0-local
    networks:
    - frappe_network
    entrypoint:
    - bash
    - -ec
    command:
    - 'ls -1 apps > sites/apps.txt

      bench set-config -g db_host "$$DB_HOST"

      bench set-config -gp db_port "$$DB_PORT"

      bench set-config -g redis_cache "redis://$$REDIS_CACHE"

      bench set-config -g redis_queue "redis://$$REDIS_QUEUE"

      bench set-config -g redis_socketio "redis://$$REDIS_QUEUE"

      bench set-config -gp socketio_port "$$SOCKETIO_PORT"

      '
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: '9000'
    volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
    pull_policy: never
  create-site:
    image: svoenrav/erp:16.53.0-local
    networks:
    - frappe_network
    volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
    entrypoint:
    - bash
    - -ec
    command:
    - "wait-for-it -t 180 db:3306\nwait-for-it -t 180 redis-cache:6379\nwait-for-it\
      \ -t 180 redis-queue:6379\nif [ ! -f sites/frontend/site_config.json ]; then\n\
      \  bench new-site --mariadb-user-host-login-scope='%' --admin-password=\"$$ADMIN_PASSWORD\"\
      \ --db-root-username=root --db-root-password=\"$$DB_ROOT_PASSWORD\" --install-app\
      \ erpnext --set-default frontend\nfi\nbench --site frontend migrate\n"
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
      configurator:
        condition: service_completed_successfully
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run the local launcher first}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run the local launcher first}
  db:
    image: mariadb:11.8
    networks:
    - frappe_network
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
    - --skip-character-set-client-handshake
    - --innodb-snapshot-isolation=OFF
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run python tools/svoenrav.py start
        first}
    volumes:
    - db-data:/var/lib/mysql
    restart: unless-stopped
  frontend:
    image: svoenrav/erp:16.53.0-local
    networks:
    - frappe_network
    depends_on:
    - websocket
    - backend
    command:
    - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: 'off'
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
    ports:
    - ${HOST_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080
    pull_policy: never
    restart: unless-stopped
  queue-long:
    image: svoenrav/erp:16.53.0-local
    networks:
    - frappe_network
    command:
    - bench
    - worker
    - --queue
    - long,default,short
    volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully
    pull_policy: never
    restart: unless-stopped
  queue-short:
    image: svoenrav/erp:16.53.0-local
    networks:
    - frappe_network
    command:
    - bench
    - worker
    - --queue
    - short,default
    volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully
    pull_policy: never
    restart: unless-stopped
  redis-queue:
    image: redis:6.2-alpine
    networks:
    - frappe_network
    volumes:
    - redis-queue-data:/data
    restart: unless-stopped
  redis-cache:
    image: redis:6.2-alpine
    networks:
    - frappe_network
    restart: unless-stopped
  scheduler:
    image: svoenrav/erp:16.53.0-local
    networks:
    - frappe_network
    command:
    - bench
    - schedule
    volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully
    pull_policy: never
    restart: unless-stopped
  websocket:
    image: svoenrav/erp:16.53.0-local
    networks:
    - frappe_network
    command:
    - node
    - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully
    pull_policy: never
    restart: unless-stopped
volumes:
  db-data: null
  redis-queue-data: null
  sites: null
  logs: null
networks:
  frappe_network:
    driver: bridge
