name: SVOENRAV source checks
on:
  push:
    paths:
      - 'erpnext/hooks.py'
      - 'erpnext/svoenrav/**'
      - 'erpnext/www/svoenrav/**'
      - 'tools/svoenrav.py'
      - 'tools/build_svoenrav_preview.py'
      - 'SVOENRAV_PREVIEW.html'
      - 'tests/svoenrav/**'
      - 'svoenrav/**'
      - '.github/workflows/svoenrav-checks.yml'
  pull_request:
    paths:
      - 'erpnext/hooks.py'
      - 'erpnext/svoenrav/**'
      - 'erpnext/www/svoenrav/**'
      - 'tools/svoenrav.py'
      - 'tools/build_svoenrav_preview.py'
      - 'SVOENRAV_PREVIEW.html'
      - 'tests/svoenrav/**'
      - 'svoenrav/**'
      - '.github/workflows/svoenrav-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Install preview renderer
        run: python -m pip install Jinja2==3.1.6
      - name: Check standalone preview matches sources
        run: python tools/build_svoenrav_preview.py --check
      - name: Check source metadata without Docker
        run: python tools/svoenrav.py check --source-only
      - name: Test SVOENRAV helpers without installing ERPNext
        run: python -m unittest discover -s tests/svoenrav -v
  interface-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check page script syntax
        run: |
          node --check erpnext/svoenrav/page/svoenrav_workshop/svoenrav_workshop.js
          node --check erpnext/svoenrav/doctype/svoenrav_settings/svoenrav_settings.js
          node --check svoenrav/preview/adapter.js
      - name: Install isolated DOM test dependencies
        run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/svoenrav-ui" jsdom@26.1.0 jquery@3.7.1
      - name: Check interface behavior without ERPNext
        run: |
          NODE_PATH="$RUNNER_TEMP/svoenrav-ui/node_modules" node tests/svoenrav/workshop_ui.cjs
          NODE_PATH="$RUNNER_TEMP/svoenrav-ui/node_modules" node tests/svoenrav/preview_ui.cjs

  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser dependencies
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/svoenrav-browser" playwright@1.56.1
          node "$RUNNER_TEMP/svoenrav-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test responsive preview in real Chromium
        run: NODE_PATH="$RUNNER_TEMP/svoenrav-browser/node_modules" node tests/svoenrav/browser_ui.cjs
