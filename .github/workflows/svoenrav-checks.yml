name: SVOENRAV source checks
on:
  push:
    paths:
      - 'erpnext/svoenrav/**'
      - 'erpnext/www/svoenrav/**'
      - 'tools/svoenrav.py'
      - 'tests/svoenrav/**'
      - 'svoenrav/**'
      - '.github/workflows/svoenrav-checks.yml'
  pull_request:
    paths:
      - 'erpnext/svoenrav/**'
      - 'erpnext/www/svoenrav/**'
      - 'tools/svoenrav.py'
      - 'tests/svoenrav/**'
      - 'svoenrav/**'
      - '.github/workflows/svoenrav-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Check source metadata without Docker
        run: python tools/svoenrav.py check --source-only
      - name: Test SVOENRAV helpers without installing ERPNext
        run: python -m unittest discover -s tests/svoenrav -v
  interface-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check page script syntax
        run: node --check erpnext/svoenrav/page/svoenrav_workshop/svoenrav_workshop.js
      - name: Install isolated DOM test dependencies
        run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/svoenrav-ui" jsdom@26.1.0 jquery@3.7.1
      - name: Check interface behavior without ERPNext
        run: NODE_PATH="$RUNNER_TEMP/svoenrav-ui/node_modules" node tests/svoenrav/workshop_ui.cjs
