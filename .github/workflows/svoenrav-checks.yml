name: SVOENRAV source checks
on:
  push:
    paths:
      - 'erpnext/svoenrav/**'
      - 'erpnext/www/svoenrav/**'
      - 'tools/svoenrav.py'
      - 'tests/svoenrav/**'
      - 'svoenrav/**'
      - '.github/workflows/svoenrav-checks.yml'
  pull_request:
    paths:
      - 'erpnext/svoenrav/**'
      - 'erpnext/www/svoenrav/**'
      - 'tools/svoenrav.py'
      - 'tests/svoenrav/**'
      - 'svoenrav/**'
      - '.github/workflows/svoenrav-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Check source metadata without Docker
        run: python tools/svoenrav.py check --source-only
      - name: Test SVOENRAV helpers without installing ERPNext
        run: python -m unittest discover -s tests/svoenrav -v
